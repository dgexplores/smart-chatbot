name: Keep ASEP server awake

# Free Render web services sleep after 15 minutes of inactivity. This
# workflow pings the health endpoint every 10 minutes so the demo stays
# warm. Public repo = free Actions minutes.
#
# Set a repository variable ASEP_SERVER_URL to your Render URL, e.g.
#   https://asep-server.onrender.com
# (or edit the fallback URL below).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${ASEP_SERVER_URL:-https://asep-server.onrender.com}"
          echo "Pinging $URL/health"
          curl -sf --max-time 20 "$URL/health" || echo "⚠️ Health check failed (server may be waking up — retrying next cycle)"
        env:
          ASEP_SERVER_URL: ${{ vars.ASEP_SERVER_URL }}
