# ─────────────────────────────────────────────────────────────
# Render blueprint — ASEP server (free tier)
#
# Import: New → Blueprint → paste this repo (dgexplores/smart-chatbot)
# Free web services sleep after 15 min idle; the GitHub Actions
# keep-alive workflow (.github/workflows/keep-alive.yml) pings
# /health every 10 minutes so it stays warm for demos.
#
# Secrets are NOT stored here — set them in the Render dashboard:
#   MONGO_URI, CLIENT_URL, PUBLIC_BASE_URL, JWT_SECRET (JWT_SECRET
#   can be auto-generated by Render since generateValue is set).
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: asep-server
    runtime: docker
    repo: https://github.com/dgexplores/smart-chatbot
    branch: main
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5001"
      # Deterministic mock LLM for reliable judge demos; set to "false"
      # and add GEMINI_API_KEY for real AI conversations.
      - key: MOCK_LLM
        value: "true"
      # Seed showcase data (leads, proposals, market history) on boot.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
